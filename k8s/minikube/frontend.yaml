apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: maia
data:
  index.html: |
    <!doctype html>
    <html>
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>MAIA Frontend Placeholder</title>
        <style>
          body { font-family: sans-serif; margin: 2rem; }
          code { background: #f4f4f4; padding: 0.2rem 0.4rem; }
        </style>
      </head>
      <body>
        <h1>MAIA Frontend</h1>
        <p>Frontend temporal en NGINX dentro de Minikube.</p>
        <p>Backend health: <code>/api/v1/health</code></p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: maia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: frontend-html
          configMap:
            name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: maia
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
