apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: maia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 360879159958.dkr.ecr.us-east-1.amazonaws.com/maia-dev-ecr:frontend-dev
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: maia
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
