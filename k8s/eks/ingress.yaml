apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maia-alb-ingress
  namespace: maia
  annotations:
    # Especificar el AWS Load Balancer Controller
    kubernetes.io/ingress.class: alb
    
    # Tipo de load balancer
    alb.ingress.kubernetes.io/load-balancer-name: maia-alb
    
    # Esquema: internet-facing para acceso público
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # Target type
    alb.ingress.kubernetes.io/target-type: ip
    
    # Puertos
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Tags para AWS
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=MAIA,ManagedBy=Terraform
    
    # Subnets (opcional: especificar subnets públicas)
    alb.ingress.kubernetes.io/subnets: subnet-* # Se reemplazará con subnets reales si es necesario

spec:
  rules:
  # Ruta para API (Backend)
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

  # Ruta raíz (Frontend)
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
