APP_NAME=FastAPI Spring Style
APP_ENV=development
APP_HOST=0.0.0.0
APP_PORT=8000

AWS_REGION=us-east-1
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
AWS_S3_BUCKET=project-files
AWS_S3_ENDPOINT_URL=http://localstack:4566

MONGO_URI=mongodb://mongo:27017
MONGO_DB=app_db
MONGO_COLLECTION=file_metadata
MONGO_PROFILES_COLLECTION=normalization_profiles
MONGO_NORMALIZATION_TRACES_COLLECTION=normalization_traces

REDIS_URI=redis://redis:6379/0
REDIS_NORMALIZATION_TRACE_PREFIX=normalization_trace

NORMALIZATION_PROFILE_SOURCE=redis
NORMALIZATION_BOOTSTRAP_ON_STARTUP=true
NORMALIZATION_DEBUG_ENABLED=false
NORMALIZATION_DEBUG_SAVE_JSON=true

NORMALIZATION_TRACEABILITY_ENABLED=true
NORMALIZATION_TRACEABILITY_OUTPUT_DIR=normalization_traceability
NORMALIZATION_TRACE_VISUALIZATION_ENABLED=true
NORMALIZATION_TRACE_REDIS_ENABLED=false
NORMALIZATION_TRACE_MONGO_ENABLED=false
NORMALIZATION_TRACE_ROUTE_B_ENABLED=true
NORMALIZATION_TRACE_ROUTE_B_FORMAT=auto
NORMALIZATION_TRACE_S3_ENABLED=false
NORMALIZATION_TRACE_S3_PREFIX=normalization-traceability
NORMALIZATION_TRACE_VISUALIZATION_ENABLED=true
