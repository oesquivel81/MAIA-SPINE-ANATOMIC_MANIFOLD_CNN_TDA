services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: maia_backend
    environment:
      APP_NAME: FastAPI Spring Style
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_S3_BUCKET: project-files
      AWS_S3_ENDPOINT_URL: http://localstack:4566
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: app_db
      MONGO_COLLECTION: file_metadata
      REDIS_URI: redis://redis:6379/0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  mongo:
    image: mongo:4.4.27
    container_name: maia_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./back/resources/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: maia_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  localstack:
    image: localstack/localstack:3.0
    container_name: maia_localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      DEBUG: 0
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./back/resources/localstack/init-localstack.sh:/docker-entrypoint-initaws.d/init-localstack.sh
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  mongo_data:
